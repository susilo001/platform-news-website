name: Verify news platform
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: news_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U news -d news_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://news:test_only@localhost:5432/news_test
      TEST_DATABASE_URL: postgresql://news:test_only@localhost:5432/news_test
      AUTH_SECRET: ci-only-secret-never-use-in-production-32
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:render
      - name: Build Docker web image
        run: docker build -t newsroom-ci .
      - name: Smoke test Docker CMS startup
        run: |
          docker run -d --network host --name newsroom-ci \
            -e DATABASE_URL -e AUTH_SECRET -e DEMO_MODE=false \
            -e ADMIN_EMAIL=docker-admin@example.test \
            -e AUTH_GOOGLE_ID=ci-placeholder -e AUTH_GOOGLE_SECRET=ci-placeholder \
            -e PREVIEW_SECRET=ci-only-preview-secret-never-use-in-production \
            -e AUTH_URL=http://localhost:3062 -e SITE_URL=http://localhost:3062 \
            -e SCHEDULING_ENABLED=false -e PORT=3062 newsroom-ci
          trap 'docker logs newsroom-ci; docker rm -f newsroom-ci' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3062/api/health > /tmp/news-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          node -e 'const h=require("/tmp/news-health.json"); if(h.status!=="ok") process.exit(1)'
          curl --fail --silent http://localhost:3062/cms/login -o /tmp/news-login.html
          grep -q 'Continue with Google' /tmp/news-login.html
          docker exec newsroom-ci npm run db:seed
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
