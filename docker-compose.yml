services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news_local
      POSTGRES_DB: news
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-news
      MINIO_ROOT_PASSWORD: local-news-password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["media-data:/data"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 local-news local-news-password; do sleep 1; done
        mc mb --ignore-existing local/news-media
        mc anonymous set download local/news-media
volumes:
  postgres-data:
  media-data:
